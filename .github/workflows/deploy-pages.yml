name: Build, scan and deploy Football rich

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Extract V1 source
        run: unzip -q -o football-rich-v1-test-candidate-0.5.0.zip -d .

      - name: Scan source for secrets
        run: |
          docker run --rm -v "$PWD:/path" zricethezav/gitleaks:latest detect --source=/path/football-rich-v1 --no-git --redact --exit-code 1

      - name: Wire Analysis Import and Match Center into repeatable build
        run: |
          sed -i '/^cd football-rich-v1$/a node ../scripts/apply-analysis-import.mjs' build-from-archive.sh
          sed -i '/^python3 \/tmp\/football-rich-v1-1-ui.py$/a node ../scripts/apply-match-center.mjs' build-from-archive.sh
          sed -i '/^node \.\.\/scripts\/apply-match-center\.mjs$/a node ../scripts/apply-v1-3-fixes.mjs' build-from-archive.sh
          sed -i '/^node \.\.\/scripts\/apply-v1-3-fixes\.mjs$/a node ../scripts/apply-v1-4-batch-import.mjs' build-from-archive.sh
          sed -i '/^bash \.\.\/scripts\/apply-v1-5-ui\.sh$/a base64 -d ../scripts/apply-v1-6-features.mjs.gz.b64 | gzip -dc > /tmp/apply-v1-6-features.mjs && node /tmp/apply-v1-6-features.mjs' build-from-archive.sh
          sed -i '/^base64 -d \.\.\/scripts\/apply-v1-6-features\.mjs\.gz\.b64 /a base64 -d ../scripts/apply-v1-7-ui.mjs.b64 > /tmp/apply-v1-7-ui.mjs && node /tmp/apply-v1-7-ui.mjs' build-from-archive.sh
          sed -i '/^base64 -d \.\.\/scripts\/apply-v1-7-ui\.mjs\.b64 /a node ../scripts/apply-v1-7-notification-delegation.mjs' build-from-archive.sh
          sed -i '/^node \.\.\/scripts\/apply-v1-7-notification-delegation\.mjs$/a node ../scripts/apply-v1-8-improvements.mjs' build-from-archive.sh
          sed -i '/^node \.\.\/scripts\/apply-v1-8-improvements\.mjs$/a node ../scripts/apply-v1-9-ui.mjs' build-from-archive.sh
          sed -i '/^node \.\.\/scripts\/apply-v1-9-ui\.mjs$/a node ../scripts/apply-v1-10-import-and-crests.mjs' build-from-archive.sh
          sed -i '/^node \.\.\/scripts\/apply-v1-10-import-and-crests\.mjs$/a node ../scripts/apply-v1-11-club-crest-renderer.mjs' build-from-archive.sh
          sed -i '/^node \.\.\/scripts\/apply-v1-11-club-crest-renderer\.mjs$/a node ../scripts/apply-v1-12-unified-match-center.mjs' build-from-archive.sh
          sed -i '/^node \.\.\/scripts\/apply-v1-12-unified-match-center\.mjs$/a node ../scripts/apply-v1-13-football-logos.mjs' build-from-archive.sh
          sed -i '/^node \.\.\/scripts\/apply-v1-13-football-logos\.mjs$/a node ../scripts/apply-v1-14-match-events.mjs' build-from-archive.sh
          sed -i '/^node \.\.\/scripts\/apply-v1-14-match-events\.mjs$/a node ../scripts/apply-v1-15-match-detail-ui.mjs' build-from-archive.sh
          sed -i '/^node \.\.\/scripts\/apply-v1-15-match-detail-ui\.mjs$/a node ../scripts/apply-v1-16-confirmation-footer.mjs' build-from-archive.sh
          sed -i '/^node \.\.\/scripts\/apply-v1-16-confirmation-footer\.mjs$/a node ../scripts/apply-v1-17-compact-match-detail.mjs' build-from-archive.sh
          sed -i '/^node \.\.\/scripts\/apply-v1-17-compact-match-detail\.mjs$/a node ../scripts/apply-v1-18-hide-finished-list.mjs' build-from-archive.sh
          sed -i '/^node \.\.\/scripts\/apply-v1-18-hide-finished-list\.mjs$/a node ../scripts/apply-v1-19-unified-status-center.mjs' build-from-archive.sh
          sed -i '/^node \.\.\/scripts\/apply-v1-19-unified-status-center\.mjs$/a node ../scripts/apply-v1-20-mobile-match-card-fix.mjs' build-from-archive.sh
          sed -i '/^node \.\.\/scripts\/apply-v1-20-mobile-match-card-fix\.mjs$/a node ../scripts/apply-v1-21-day-groups-and-mobile-layout.mjs' build-from-archive.sh
          sed -i '/^node \.\.\/scripts\/apply-v1-21-day-groups-and-mobile-layout\.mjs$/a node ../scripts/apply-v1-22-finished-events-mobile-layout.mjs' build-from-archive.sh
          sed -i '/^node \.\.\/scripts\/apply-v1-22-finished-events-mobile-layout\.mjs$/a node ../scripts/apply-v1-23-day-groups-and-event-text.mjs' build-from-archive.sh
          sed -i '/^node \.\.\/scripts\/apply-v1-23-day-groups-and-event-text\.mjs$/a node ../scripts/apply-v1-24-result-meta-footer.mjs' build-from-archive.sh
          sed -i '/^node \.\.\/scripts\/apply-v1-24-result-meta-footer\.mjs$/a node ../scripts/apply-v1-25-compact-expandable-match-detail.mjs' build-from-archive.sh
          sed -i '/^node \.\.\/scripts\/apply-v1-25-compact-expandable-match-detail\.mjs$/a node ../scripts/apply-v1-26-finished-match-detail.mjs' build-from-archive.sh
          sed -i '/^node \.\.\/scripts\/apply-v1-26-finished-match-detail\.mjs$/a node ../scripts/apply-v1-27-direct-match-detail-actions.mjs' build-from-archive.sh

      - name: Build Football rich
        run: bash build-from-archive.sh

      - name: Run smoke tests
        working-directory: football-rich-v1
        run: npm run test:smoke

      - name: Run unit tests
        working-directory: football-rich-v1
        run: npm test

      - name: Rebuild final PWA with Pages base path and service worker registration
        run: bash build-from-archive.sh

      - name: Audit generated PWA files
        working-directory: football-rich-v1
        shell: bash
        run: |
          echo "=== Generated files relevant to PWA ==="
          find dist -type f | sort | grep -Ei 'manifest|service.?worker|sw\\.js|icon|favicon|apple-touch' || true
          echo "=== Manifest and install metadata ==="
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = path.resolve('dist');
          const files = [];
          function walk(dir) {
            for (const ent of fs.readdirSync(dir, {withFileTypes:true})) {
              const p = path.join(dir, ent.name);
              if (ent.isDirectory()) walk(p);
              else files.push(p);
            }
          }
          walk(root);
          const manifests = files.filter(p => /manifest.(webmanifest|json)/i.test(path.basename(p)));
          console.log('Manifest files:', manifests.map(p => path.relative(root,p)));
          for (const file of manifests) {
            const m = JSON.parse(fs.readFileSync(file,'utf8'));
            console.log(JSON.stringify({
              name:m.name, short_name:m.short_name, display:m.display,
              start_url:m.start_url, scope:m.scope,
              icons:(m.icons||[]).map(i=>({src:i.src,sizes:i.sizes,type:i.type,purpose:i.purpose}))
            }, null, 2));
            for (const icon of (m.icons||[])) {
              const rel = path.basename(icon.src);
              const candidates = [path.resolve(root, rel), path.resolve(path.dirname(file), icon.src)];
              console.log('ICON', icon.src, 'exists=', candidates.some(p=>fs.existsSync(p)));
            }
          }
          const swFiles = files.filter(p => ['sw.js','service-worker.js','sw.min.js','service-worker.min.js'].includes(path.basename(p).toLowerCase()));
          console.log('Service worker candidates:', swFiles.map(p=>path.relative(root,p)));
          const html = files.filter(p=>p.endsWith('.html')).map(p=>fs.readFileSync(p,'utf8')).join('\n');
          console.log('HTML contains manifest link:', html.includes('rel="manifest"') || html.includes("rel='manifest'"));
          console.log('HTML service worker registration references:', html.includes('navigator.serviceWorker.register'));
          if (!swFiles.length || !html.includes('navigator.serviceWorker.register')) {
            throw new Error('PWA installability check failed: service worker file or registration is missing');
          }
          const index = fs.readFileSync(path.join(root,'index.html'),'utf8');
          if (!index.includes('__footballRichBootGuardInstalled')) throw new Error('Startup watchdog missing from final HTML');
          if (!index.includes('main.js?v=20261116-v1-27')) throw new Error('Cache-busted app entry missing from final HTML');
          if (!fs.existsSync(path.join(root,'main.js'))) throw new Error('App entry main.js missing from final output');
          console.log('Startup watchdog, cache-busted app entry and main.js verified.');
          console.log('Service worker source preview:', fs.readFileSync(swFiles[0], 'utf8').slice(0, 1000));
          const swSource = fs.readFileSync(swFiles[0], 'utf8');
          if (!swSource.includes("const CACHE_NAME = 'football-rich-shell-v35'")) throw new Error('Service worker cache version is stale');
          console.log('Service worker cache version v13 verified.');
          const app = fs.readFileSync(path.join(root,'main.js'),'utf8');
          for (const feature of ['fr-national-flag-wrap','installReleaseUpdateCheck','footballRichLastNotifiedVersion','mc-calendar-head','mc-risk-badge','coverPct >= 60','coverPct >= 45','probBar +','allUpcomingMatches.map','ยังประเมินความเสี่ยงไม่ได้','knownClubCrests','mc-team-crest','FC Machida Zelvia','Kashiwa Reysol','Kawasaki Frontale','Vissel Kobe','footballRichNotificationsV1','fr-notification-header-button','fr-national-flag','Republic of Ireland','🇧🇴','fr-notification-unread-label','readAt:null','ศูนย์แจ้งเตือน']) {
            if (!app.includes(feature)) throw new Error('V1.5.1 UI feature missing: ' + feature);
          }
          if (app.includes('id="match-form"') || app.includes("currentView === 'matches'")) throw new Error('Legacy duplicate fixture/manual-entry UI remains visible');
          if (!fs.existsSync(path.join(root,'app-version.json'))) throw new Error('App version manifest missing');
          const appVersion = JSON.parse(fs.readFileSync(path.join(root,'app-version.json'),'utf8'));
          if (appVersion.version !== '1.27') throw new Error('App version manifest is stale');
          if (app.includes('กำไรจำลองสุทธิ') || app.includes("card('ผลชำระเดิมพัน'")) throw new Error('V1.9 non-gambling Performance cleanup failed');
          for (const statusClass of ['mc-status-upcoming','mc-status-live','mc-status-finished']) if (!app.includes(statusClass)) throw new Error('V1.21 Match Center status badge missing: '+statusClass);
          const appCss = fs.readFileSync(path.join(root,'styles/main.css'),'utf8');
          for (const layoutRule of ['.mc-card{box-sizing:border-box;width:100%','.mc-teams{box-sizing:border-box;display:grid;width:100%','.mc-team-name{display:block;box-sizing:border-box;width:100%']) if (!appCss.includes(layoutRule)) throw new Error('V1.21 mobile Match Center layout missing: '+layoutRule);
          if (!app.includes('renderMatchesByDay') || !app.includes('resultByMatch.has(match.id) ? renderFinished(match) : renderUpcoming(match)') || app.includes('allMatches.filter(m => !resultByMatch.has(m.id)).map(renderUpcoming)')) throw new Error('V1.21 unified all-status day-grouped Match Center audit failed');
          for (const feature of ['renderMatchesByDay','mc-day-section','mc-day-heading']) if (!app.includes(feature)) throw new Error('V1.21 day grouping missing: '+feature);
          for (const rule of ['V1.21: enforce readable horizontal team names','writing-mode:horizontal-tb!important','overflow-wrap:break-word!important']) if (!appCss.includes(rule)) throw new Error('V1.21 mobile card fix missing: '+rule);
          for (const rule of ['V1.22: prevent finished-match event panel','article.mc-card .mc-events','grid-template-columns:minmax(0,1fr)!important','writing-mode:horizontal-tb!important']) if (!appCss.includes(rule)) throw new Error('V1.22 finished-match event layout missing: '+rule);
          for (const crestUrl of ['machida-zelvia-logo-footylogos.svg','vissel-kobe-logo-footylogos.svg','kashiwa-reysol-logo-footylogos.svg','kawasaki-frontale-logo-footylogos.svg']) if (!app.includes(crestUrl)) throw new Error('V1.13 club crest asset missing: '+crestUrl);
          for (const feature of ['mc-event-columns','mc-assist-boot','mc-confirmed-at','renderSideEvents','mc-event-minute','eventMinuteKey']) if (!app.includes(feature) && !appCss.includes(feature)) throw new Error('V1.15 match detail UI feature missing: '+feature);
          if (app.includes('แหล่งข้อมูล:') || app.includes('ยืนยันผล:')) throw new Error('V1.16 verbose source or top confirmation metadata remains in match renderer');
          for (const feature of ['mc-card-icon-yellow','mc-card-icon-red','.mc-event-ball']) if (!appCss.includes(feature)) throw new Error('V1.15 event icon style missing: '+feature);
          if (!app.includes('data-match-day') || !app.includes('renderMatchesByDay()')) throw new Error('V1.23 day grouping runtime renderer missing');
          if (app.includes('allMatches.map(m => resultByMatch.has(m.id) ? renderFinished(m) : renderUpcoming(m)).join')) throw new Error('V1.23 flat match list remains');
          for (const rule of ['V1.23: stable mobile match details and visible day-separated Match Center','article.mc-card .mc-event span','writing-mode:horizontal-tb!important']) if (!appCss.includes(rule)) throw new Error('V1.23 mobile event/day CSS missing: '+rule);
          for (const feature of ['mc-detail-modal','historyHtml','MATCH ID: ','RESULT ID: ','revisionHistory']) if (!app.includes(feature)) throw new Error('V1.24/V1.25 compact detail metadata missing: '+feature);
          if (!app.includes('window.__footballRichOpenMatchDetail = matchId =>') || (app.match(/onclick="window\\.__footballRichOpenMatchDetail\\(/g)||[]).length !== 2) throw new Error('V1.27 direct detail actions missing for both match states');
          for (const rule of ['V1.24: full-width readable result metadata and snapshot history footer','.mc-result-meta','.mc-history-row{display:block!important']) if (!appCss.includes(rule)) throw new Error('V1.24 result metadata layout missing: '+rule);
          console.log('V1.9 verified: existing match analysis retained, financial summary cards removed, unread notification center and release metadata updated.');
          NODE

      - name: Diagnose app entry and UI assets
        working-directory: football-rich-v1
        shell: bash
        run: |
          echo "=== SOURCE TREE ==="
          find src public -maxdepth 3 -type f 2>/dev/null | sort
          echo "=== PACKAGE SCRIPTS ==="
          node -e "console.log(JSON.stringify(require('./package.json').scripts,null,2))"
          echo "=== GENERATED HTML ==="
          sed -n '1,240p' dist/index.html
          echo "=== MAIN ENTRY ==="
          for f in src/main.ts src/main.js src/app.ts src/app.js src/pwa.ts src/pwa.js; do
            if [ -f "$f" ]; then echo "--- $f ---"; sed -n '1,260p' "$f"; fi
          done
          echo "=== GENERATED JS FILES ==="
          find dist -maxdepth 2 -type f -name '*.js' -printf '%p %s bytes\\n'

      - name: Inspect runtime startup and styling
        working-directory: football-rich-v1
        shell: bash
        run: |
          echo "=== PWA MODULE ==="
          cat src/pwa.ts
          echo "=== DATABASE OPEN / STORE SETUP ==="
          sed -n '1,220p' src/data/database.ts
          echo "=== MAIN RENDER STARTUP ==="
          tail -n 100 src/main.ts
          echo "=== CSS SELECTORS AND ROOT ==="
          sed -n '1,240p' src/styles/main.css
          echo "=== BUILD STATIC SCRIPT ==="
          sed -n '1,220p' scripts/build-static.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: football-rich-v1/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
